AboutApp = [Uyumluluk] \r\n 1 = Win10、8.1、8、7、Vista ile uyumludur \r\n 2 = 64 bit、32 bit işletim sistemleriyle uyumludur\r\n 3 = Yüksek DPI uyumludur, 150% ölçeklemede en iyi sonucu verir\r\n\r\n[Açık kaynak]\r\n 1 = Programlama dilleri: C sharp，Winform，MIT Lisansı\r\n 2 = Github deposu：https://github.com/BluePointLilac/ContextMenuManager \r\n 3 = Gitee deposu：https://gitee.com/BluePointLilac/ContextMenuManager \r\n\r\n[İpuçları]\r\n 1 = Bu program çok miktarda sistem dosyası ve kayıt defteri girdisi okur/yazar,\r\n bu işlemler son derece hassas olduğundan Windows Defender tarafından işaretlenebilir, lütfen bu programı elle dışlama listesine ekleyin\r\n\r\n 2 = Bazı özel menü öğeleri başka etkenlerden etkilenebilir ve bağlam menüsünde görünmeyebilir. \r\n Ancak programın kullandığı genel kurallara göre bu programda hâlâ etkin olarak görüntülenebilirler. Bu normaldir. \r\n\r\n 3 = Her bağlam menüsü yönetim programının menüleri devre dışı bırakma yöntemi farklı olabilir. Aynı anda birden fazla bağlam menüsü yönetim programı kullanmayın. \r\n Çoğu program basit ve kalıcı olmayan bir yedekle-sil yöntemi kullanır. Bu program, anahtarları olabildiğince gizlemek için işletim sisteminin sağladığı anahtar değerlerini kullanır. \r\n Daha önce bir menü öğesini devre dışı bırakmak için başka bir program kullandıysanız, lütfen onu o programla geri yükleyin, aksi halde bu programda göremeyebilirsiniz. \r\n\r\n 4 = Bu program, kaldırılmış programları temizlemek için tasarlanmamıştır, ancak bu tür menü öğelerinin kayıt defteri ve dosya konumlarını bulmanıza yardımcı olabilir.\r\n Dilediğinizi yapabilirsiniz. Yalnızca yeni başlayan biriyseniz (veya bazı seçeneklerden emin değilseniz), yalnızca etkinleştir\devre dışı bırak anahtarını değiştirin (işletim sistemine zarar verme riskini azaltmak için). 

Dictionaries = [Sözlük açıklaması] \r\n Bu programın birkaç sözlük dosyası vardır ve her sözlüğün bir kullanıcı sözlüğü ile bir ağ sözlüğü bulunur. \r\n Bu programa bir sözlük eklemek isterseniz, dosyayı sağ tıklayıp kaydedebilir ve eklemek için dosyadaki yönergeleri izleyebilirsiniz. \r\n Sözlüğünüzü e-postama gönderin veya GitHub'a yükleyin ve bu projeye katkıda bulunun. \r\n Sağ sekme orijinal sözlük içeriğidir, görüntülemek için sekmeler arasında geçiş yapabilirsiniz \r\n\r\n[Sözlük içeriği]\n 1 = Program görüntüleme metni dil sözlüğü (Languages dizini) \r\n 2 = ShellEx menü öğesi GUID metin simge sözlüğü (GuidInfosDic.ini) \r\n 3 = Üçüncü taraf program menüsü dahili ayar sözlüğü (DetailedEditDic.xml) \r\n 4 = Gelişmiş menü öğeleri sözlüğü (EnhanceMenusDic.xml) 

Donate = Bu program tamamen ücretsizdir. Bu yazılımı yararlı bulursanız,\r\n aşağıdaki QR kodunu tarayarak (WeChat, Alipay, Tencent QQ) bağış yapabilirsiniz.\r\n Miktar size kalmış. Desteğiniz için teşekkürler! Ayrıca projeyi Github veya Gitee'de \r\n yıldızlamayı düşünmenizi rica ederim (bu benim için çok önemli!).
